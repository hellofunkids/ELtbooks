# Render Blueprint — 무료 구성: Render Free 웹 서비스(화면 + /api + SSE)
#   + Neon Free PostgreSQL(외부, 만료 없음) + Cloudflare R2(이미지).
# Render 무료 DB는 30일 뒤 만료되므로 사용하지 않습니다.
# 비밀값은 여기에 쓰지 않습니다. sync: false 항목은 Render 화면에서 직접 입력합니다.
# 나중에 잠들지 않게 하려면 plan 을 starter 로 바꾸기만 하면 됩니다(코드·자료 이전 불필요).
services:
  - type: web
    name: elt-analyzer
    runtime: node
    region: singapore
    plan: free               # 15분 무접속 시 잠듦, 다음 접속 때 약 1분 후 깨어남
    buildCommand: npm install -g pnpm@10.28.0 && pnpm install --frozen-lockfile --prod=false && pnpm run build:node && pnpm run db:push
    startCommand: pnpm run start:node
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL       # Neon의 "Direct connection" 주소(-pooler 없는 것)
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_PREFIX           # 기존 R2 버킷을 다른 용도와 같이 쓸 때만 입력(예: elt-analyzer)
        sync: false
