kind = "web"
previewPath = "/"
title = "ELT 교재 설명 AI"
version = "1.0.0"
id = "artifacts/elt-analyzer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19219

[services.development]
run = "pnpm --filter @workspace/elt-analyzer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/elt-analyzer", "run", "build" ]
publicDir = "artifacts/elt-analyzer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19219"
BASE_PATH = "/"
